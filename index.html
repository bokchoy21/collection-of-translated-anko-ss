<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="icon.jpg">
    <title>小说目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 30px 0;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .preface {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-left: 5px solid #ff6b6b;
        }
        .preface-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .preface-content {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
        }
        .preface-content p {
            margin-bottom: 15px;
            text-indent: 2em;
        }
        .preface-content p:last-child {
            margin-bottom: 0;
        }
        .toc-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .toc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }
        .toc-title {
            font-size: 1.8em;
            color: #333;
            margin: 0;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        .chapter-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .chapter-item {
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        .chapter-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #e3f2fd;
        }
        .chapter-link {
            display: block;
            padding: 20px;
            text-decoration: none;
            color: #333;
            height: 100%;
        }
        .chapter-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        .chapter-title {
            font-size: 1em;
            line-height: 1.4;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            opacity: 0.8;
        }
        /* 返回顶部按钮样式 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .back-to-top:hover {
            background: #764ba2;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .back-to-top.show {
            display: flex;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        @media (max-width: 768px) {
            .chapter-list {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2em;
            }
            .toc-container {
                padding: 20px;
            }
            .preface {
                padding: 20px;
            }
            .back-to-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            .toc-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>馅文合集</h1>
            <p id="chapterCount">加载中...</p>
        </div>
        
        <!-- 前言区域 -->
        <div class="preface">
            <div class="preface-title">前言</div>
            <div class="preface-content">
                
    <p>这是前言</p>
    
            </div>
        </div>
        
        <div class="toc-container">
            <div class="toc-header">
                <h2 class="toc-title">章节目录</h2>
                <button class="refresh-btn" onclick="loadChaptersList()">
                    刷新目录
                </button>
            </div>
            
            <div id="chapterListContainer" class="loading">
                正在加载章节列表...
            </div>
        </div>
        
        <div class="footer">
            <p>点击章节标题开始阅读</p>
        </div>
    </div>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" onclick="scrollToTop()" id="backToTopBtn" title="返回顶部">
        ↑
    </button>

    <script>
        // 页面加载完成后自动加载章节列表
        document.addEventListener('DOMContentLoaded', function() {
            loadChaptersList();
        });
        
        // 加载章节列表函数
        async function loadChaptersList() {
            const container = document.getElementById('chapterListContainer');
            const chapterCount = document.getElementById('chapterCount');
            
            // 显示加载状态
            container.innerHTML = '<div class="loading">正在加载章节列表...</div>';
            
            try {
                // 从JSON文件加载章节列表
                const response = await fetch('chapters_list.json');
                const chapters = await response.json();
                
                // 更新章节数量
                chapterCount.textContent = '共 ' + chapters.length + ' 个章节';
                
                // 生成章节列表HTML
                let html = '<ul class="chapter-list">';
                
                chapters.forEach(chapter => {
                    html += `
                    <li class="chapter-item">
                        <a href="chapters/chapter_${chapter.file_index.toString().padStart(3, '0')}.html" class="chapter-link">
                            <div class="chapter-number">${chapter.display_number}</div>
                            <div class="chapter-title">${chapter.display_title}</div>
                        </a>
                    </li>`;
                });
                
                html += '</ul>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('加载章节列表失败:', error);
                container.innerHTML = '<div class="loading">加载失败，请刷新页面重试</div>';
            }
        }
        
        // 获取返回顶部按钮
        const backToTopBtn = document.getElementById('backToTopBtn');
        
        // 监听滚动事件
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        
        // 返回顶部函数
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
